<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#132849"><title>WESTube図書館 | ペペランド</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#17243b;background:#f5f7fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(125deg,#10294e,#315b91);color:white;padding:42px 20px 35px}header .inner,main,footer{max-width:1080px;margin:auto}header small{letter-spacing:.14em;color:#bcd4f6}h1{font-size:clamp(26px,5vw,40px);margin:12px 0}header p{color:#dbe9fa;margin:0}.panel{background:white;border:1px solid #e1e7f0;border-radius:18px;padding:22px;box-shadow:0 5px 24px #1533590c;margin:22px 0}.panel h2{font-size:20px;margin:0 0 15px}.search{width:100%;font-size:17px;padding:14px;border:1px solid #c6d3e4;border-radius:12px}label{display:block;font-size:13px;font-weight:700;color:#4c617d;margin-bottom:6px}.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}select{width:100%;padding:11px;border:1px solid #c6d3e4;border-radius:10px;background:#fff;font-size:14px}[hidden]{display:none!important}.tagbox{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{border:1px solid #c6d3e4;background:white;border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13px;color:#315073}.chip.active{background:#214e85;color:white;border-color:#214e85}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}.reset{border:0;background:#eaf0f8;color:#284b79;border-radius:9px;padding:10px 15px;cursor:pointer}.results-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0 12px}.results-head h2{margin:0;font-size:21px}.results-head select{width:auto}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.card{overflow:hidden;border-radius:15px;background:white;border:1px solid #e0e7f0;box-shadow:0 4px 18px #132a470b}.thumb{aspect-ratio:16/9;display:block;background:#e8edf6;position:relative}.thumb img{width:100%;height:100%;object-fit:cover}.thumb:after{content:'▶';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#10294ec9;color:white;padding:10px 14px;border-radius:12px;font-size:17px}.body{padding:15px}.meta{font-size:12px;color:#677991;display:flex;gap:8px;flex-wrap:wrap}.body h3{font-size:15px;line-height:1.65;margin:8px 0 10px;min-height:48px}.body h3 a{color:#193b68;text-decoration:none}.body h3 a:hover{text-decoration:underline}.pills{display:flex;flex-wrap:wrap;gap:5px}.pill{background:#edf3fa;color:#345b85;font-size:11px;border-radius:5px;padding:4px 7px}.pill.sub{background:#e9e9fb;color:#544a8d}.more{display:block;margin:24px auto;border:0;border-radius:11px;padding:13px 25px;background:#214e85;color:white;cursor:pointer;font-size:15px}.gacha-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.gacha-button{border:0;border-radius:11px;padding:12px 22px;background:#214e85;color:white;font-weight:700;font-size:16px;cursor:pointer}.gacha-note{color:#60718a;font-size:13px}.gacha-result{margin-top:16px;max-width:410px}.empty{text-align:center;padding:50px 10px;color:#60718a}footer{padding:30px 20px 55px;color:#77849a;font-size:12px;text-align:center}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #75aaf5;outline-offset:2px}@media(max-width:780px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){header{padding:32px 18px}main{padding:0 12px}.panel{padding:17px}.cards{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr;gap:10px}.body h3{min-height:0}}
</style></head><body>
<header><div class="inner"><small>ペペランド ／ WESTube LIBRARY</small><h1>📚 WESTube図書館</h1><p>何してるWEST.が見たい？　見たい動画に出会える、小さな図書館。</p></div></header>
<main><section class="panel"><h2>🔎 動画を探す</h2><label for="q">キーワード（タイトル・企画名・楽曲名など）</label><input id="q" class="search" type="search" placeholder="例：BBQ、誕生日、流星…" autocomplete="off"><div class="filters"><div><label for="type">動画の長さ</label><select id="type"><option value="">すべて</option></select></div><div><label for="category">大分類</label><select id="category"><option value="">すべて</option></select></div><div id="sub-wrap" hidden><label for="sub">サブ分類</label><select id="sub"><option value="">すべて</option></select></div><div><label for="series">企画・シリーズ</label><select id="series"><option value="">すべて</option></select></div><div><label for="member">出演メンバー</label><select id="member"><option value="">すべて</option></select></div><div><label for="year">公開年</label><select id="year"><option value="">すべて</option></select></div></div><div style="margin-top:18px"><label>何してるWEST.が見たい？（内容タグ・複数選択OK）</label><div class="tagbox" id="tags"></div></div><div class="actions"><span id="count" aria-live="polite">読み込み中…</span><button class="reset" id="reset" type="button">条件をリセット</button></div></section><section class="panel"><h2>🎲 WESTubeガチャ！</h2><p class="gacha-note">検索条件に合う動画から、運命の1本を選ぶで！条件なしなら全806本が対象やで。</p><div class="gacha-actions"><button type="button" id="gacha" class="gacha-button">🎲 1本選ぶ！</button><span id="gacha-status" class="gacha-note" aria-live="polite"></span></div><div id="gacha-result" class="gacha-result"></div></section><section><div class="results-head"><h2>📺 動画一覧</h2><div><label for="sort">並び順</label><select id="sort"><option value="new">公開日が新しい順</option><option value="old">公開日が古い順</option><option value="title">タイトル順</option></select></div></div><div id="cards" class="cards"></div><button id="more" class="more" hidden>もっと見る</button><div id="empty" class="empty" hidden>条件に合う動画が見つからへんかったで。条件を少し変えてみてな☺️</div></section></main><footer>WESTube図書館 Ver.0.01 ／ 非公式ファン制作サイト。動画はYouTubeで再生されます。</footer>
<script>
'use strict';
const $=id=>document.getElementById(id), fields=['type','category','sub','series','member','year'], chosen=new Set();let videos=[],shown=0,matched=[];const PAGE=24;
const mapping={type:'動画／ショート',category:'大分類',sub:'サブ分類',series:'企画・シリーズ',member:'出演メンバー',year:'公開年'};
const members=['重岡','桐山','中間','神山','藤井','濵田','小瀧'];
function normalizeMembers(value){return [...new Set((Array.isArray(value)?value:[value]).flatMap(x=>String(x||'').split(/[,，、・]/).map(s=>s.trim()).filter(Boolean)))];}
function fill(id,values){const select=$(id);const list=(id==='member'?members.filter(m=>values.includes(m)):[...new Set(values.filter(Boolean))].sort((a,b)=>id==='year'?b.localeCompare(a,'ja'):a.localeCompare(b,'ja')));for(const v of list){const o=document.createElement('option');o.value=v;o.textContent=v;select.append(o)}}
function refreshDependentFilters(){
 const category=$('category').value;
 const subWrap=$('sub-wrap');
 subWrap.hidden=category!=='企画';
 if(category!=='企画')$('sub').value='';
 const series=$('series'),previous=series.value;
 series.replaceChildren(new Option('すべて',''));
 const options=videos.filter(v=>!category||v['大分類']===category).flatMap(v=>Array.isArray(v['企画・シリーズ'])?v['企画・シリーズ']:[v['企画・シリーズ']]);
 fill('series',options);
 series.value=[...series.options].some(o=>o.value===previous)?previous:'';
}
function init(){for(const id of fields){const key=mapping[id];fill(id,videos.flatMap(v=>Array.isArray(v[key])?v[key]:[v[key]]))}const tagCounts=new Map();videos.forEach(v=>v['内容タグ'].forEach(t=>tagCounts.set(t,(tagCounts.get(t)||0)+1)));for(const tag of [...tagCounts.keys()].sort((a,b)=>a.localeCompare(b,'ja'))){const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=tag+' ('+tagCounts.get(tag)+')';b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>{if(chosen.has(tag))chosen.delete(tag);else chosen.add(tag);b.classList.toggle('active',chosen.has(tag));b.setAttribute('aria-pressed',String(chosen.has(tag)));update()});$('tags').append(b)}fields.forEach(id=>$(id).addEventListener('change',()=>{if(id==='category')refreshDependentFilters();update()}));$('q').addEventListener('input',update);$('sort').addEventListener('change',update);$('reset').addEventListener('click',()=>{fields.forEach(id=>$(id).value='');$('q').value='';chosen.clear();document.querySelectorAll('.chip').forEach(b=>{b.classList.remove('active');b.setAttribute('aria-pressed','false')});refreshDependentFilters();update()});$('more').addEventListener('click',appendPage);$('gacha').addEventListener('click',drawGacha);refreshDependentFilters();update()}
function update(){const q=$('q').value.trim().toLocaleLowerCase();matched=videos.filter(v=>{if(q&&!['タイトル','企画・シリーズ','サブ分類','楽曲','メモ'].concat('出演メンバー').some(k=>(Array.isArray(v[k])?v[k].join(' '):String(v[k]||'')).toLocaleLowerCase().includes(q)))return false;for(const id of fields){const selected=$(id).value;if(!selected)continue;const val=v[mapping[id]];if(Array.isArray(val)?!val.includes(selected):val!==selected)return false}for(const t of chosen)if(!v['内容タグ'].includes(t))return false;return true});const sort=$('sort').value;matched.sort((a,b)=>sort==='title'?a['タイトル'].localeCompare(b['タイトル'],'ja'):sort==='old'?a['公開日'].localeCompare(b['公開日']):b['公開日'].localeCompare(a['公開日']));shown=0;$('cards').replaceChildren();$('gacha-result').replaceChildren();$('gacha-status').textContent='';lastGachaId=null;$('gacha').disabled=matched.length===0;$('count').textContent=`${matched.length} 本 / 全 ${videos.length} 本`;$('empty').hidden=matched.length!==0;appendPage()}
let lastGachaId=null;
function drawGacha(){if(!matched.length)return;const pool=matched.length>1?matched.filter(v=>v['動画ID']!==lastGachaId):matched;const v=pool[Math.floor(Math.random()*pool.length)];lastGachaId=v['動画ID'];const result=$('gacha-result');result.replaceChildren();const card=node('article','card');const a=node('a','thumb');a.href=v.URL;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label',v['タイトル']+' をYouTubeで見る');const img=document.createElement('img');img.src=`https://i.ytimg.com/vi/${encodeURIComponent(v['動画ID'])}/hqdefault.jpg`;img.alt='';img.loading='lazy';a.append(img);card.append(a);const body=node('div','body');const meta=node('div','meta');meta.append(node('span','',v['公開日'].slice(0,10)),node('span','',v['大分類']));body.append(meta);const h=node('h3');const link=node('a','',v['タイトル']);link.href=v.URL;link.target='_blank';link.rel='noopener noreferrer';h.append(link);body.append(h);card.append(body);result.append(card);$('gacha-status').textContent=`${matched.length}本の中から選んだで！ もう一回押してもOK 🎉`;}
function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function appendPage(){const batch=matched.slice(shown,shown+PAGE);const fragment=document.createDocumentFragment();for(const v of batch){const card=node('article','card');const a=node('a','thumb');a.href=v.URL;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('aria-label',v['タイトル']+' をYouTubeで見る');const img=document.createElement('img');img.src=`https://i.ytimg.com/vi/${encodeURIComponent(v['動画ID'])}/hqdefault.jpg`;img.alt='';img.loading='lazy';a.append(img);card.append(a);const body=node('div','body'),meta=node('div','meta');meta.append(node('span','',v['公開日'].slice(0,10)),node('span','',v['動画／ショート']),node('span','',v['大分類']));body.append(meta);const h=node('h3');const link=node('a','',v['タイトル']);link.href=v.URL;link.target='_blank';link.rel='noopener noreferrer';h.append(link);body.append(h);const pills=node('div','pills');for(const [text,sub] of [[v['サブ分類'],true],[v['企画・シリーズ'],false],...v['内容タグ'].map(x=>[x,false])])if(text)pills.append(node('span',sub?'pill sub':'pill',text));body.append(pills);card.append(body);fragment.append(card)}$('cards').append(fragment);shown+=batch.length;$('more').hidden=shown>=matched.length}
fetch('./videos.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{videos=data.map(v=>({...v,'出演メンバー':normalizeMembers(v['出演メンバー'])}));init()}).catch(err=>{$('count').textContent='データを読み込めませんでした。GitHub Pages上で開いてください。';$('empty').hidden=false;$('empty').textContent='videos.jsonを読み込めませんでした。index.htmlと同じフォルダに配置しているか確認してな。';console.error(err)});
</script></body></html>
